<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honey House | จัดการคำสั่งซื้อ</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1100px;margin:45px auto;padding:0 20px}.admin h1{font-family:Kanit;color:var(--green)}.admin-panel{background:white;border:1px solid #eee;padding:22px;margin:18px 0}.admin input,.admin select{padding:10px;border:1px solid #ddd;margin:5px;font:14px Prompt}.admin button{padding:9px 14px;background:var(--green);color:white;border:0;margin:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.muted{color:#777;font-size:13px}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✿</span><span>HONEY <b>HOUSE</b><small>ORDER MANAGEMENT</small></span></a><a href="index.html">กลับหน้าร้าน ←</a></header><main class="admin"><h1>จัดการคำสั่งซื้อ</h1><p class="muted">ดูรายการออเดอร์ อัปเดตสถานะ พิมพ์ใบหยิบสินค้าและใบจ่าหน้าพัสดุ</p><section class="admin-panel"><label>Google Apps Script URL <input id="apiUrl" style="width:min(520px,100%)" placeholder="https://script.google.com/macros/s/.../exec"></label><br><label>Admin token <input id="token" type="password" placeholder="ADMIN_TOKEN"></label><button id="saveSettings">บันทึกการตั้งค่าในเบราว์เซอร์นี้</button><button id="loadOrders">โหลดคำสั่งซื้อ</button><p id="status" class="muted"></p></section><section class="admin-panel"><h2>รายการคำสั่งซื้อ</h2><div class="table-wrap"><table><thead><tr><th>เลขที่</th><th>วันที่</th><th>ลูกค้า / ที่อยู่</th><th>สินค้า</th><th>ยอดรวม</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="orders"><tr><td colspan="7">กรุณาตั้งค่า URL และ token แล้วกดโหลดคำสั่งซื้อ</td></tr></tbody></table></div></section></main><script src="admin.js"></script></body></html>
